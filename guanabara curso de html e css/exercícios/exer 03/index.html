<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>teste com imagens</title>
</head>
<body>
    <h1>testando carga e imagens</h1>
    <p>abaixo você vai ver uma imagem que está na mesma pasta.</p>
    <img src="imagen html.png" alt="logo html">
    <p>podemos carregar imagens que estão em sub-pastas como no exemplo abaixo</p>
    <img src="imagens/imagen css.png" alt="logo css">
    <p>
     também podemos carregar imagens externas(não baixadas) como no exemplo abaixo. <br>
     é só colocar a url da imagem.
   </p>
    <img src="https://iconape.com/wp-content/png_logo_vector/javascript-logo.png" alt="logo js">
</body>
</html>
